services:
  mcp:
    image: ${VRCH_MCP_IMAGE:?Set the image built from the pushed source commit}
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 64
    environment:
      VRCH_MCP_ISSUER: ${VRCH_MCP_ISSUER:?Set the HTTPS issuer}
      VRCH_MCP_DATA: /data
      VRCH_MCP_PORT: 18916
      VRCH_MCP_ENCRYPTION_KEY_FILE: /run/secrets/recovery-key
      VRCH_MCP_DEVICE_VERIFY_KEY_FILE: /run/secrets/device-public.pem
      VRCH_MCP_DEVICE_ISSUER: ${VRCH_MCP_DEVICE_ISSUER:?Set the Device Manager issuer}
      VRCH_MCP_DIRECTORY_URL: ${VRCH_MCP_DIRECTORY_URL:?Set the trusted directory URL}
      VRCH_MCP_BROWSER_ORIGINS: ${VRCH_MCP_BROWSER_ORIGINS:-}
      VRCH_MCP_SDK_VALIDATION: ${VRCH_MCP_SDK_VALIDATION:-false}
    volumes:
      - ${VRCH_MCP_STATE_DIR:?Set a private persistent directory}:/data
      - ${VRCH_MCP_RECOVERY_KEY_FILE:?Set the private recovery key file}:/run/secrets/recovery-key:ro
      - ${VRCH_MCP_VERIFY_KEY_FILE:?Set the public verification key file}:/run/secrets/device-public.pem:ro
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
